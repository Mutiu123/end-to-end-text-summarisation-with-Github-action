apiVersion: v1
kind: Service
metadata:
  name: text-summarizer
  namespace: text-summarizer
  labels:
    app: text-summarizer
    component: api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  sessionAffinity: None
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  selector:
    app: text-summarizer
    component: api
