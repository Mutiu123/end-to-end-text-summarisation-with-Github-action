apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: text-summarizer

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - networkpolicy.yaml
  - ingress.yaml
  - poddisruptionbudget.yaml

commonLabels:
  app: text-summarizer
  managed-by: kustomize

images:
  - name: text-summarizer
    newName: your-registry/text-summarizer
    newTag: latest
