apiVersion: apps/v1
kind: Deployment
metadata:
  name: text-summarizer
  namespace: text-summarizer
  labels:
    app: text-summarizer
    version: v1
    component: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: text-summarizer
      component: api
  template:
    metadata:
      labels:
        app: text-summarizer
        component: api
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: text-summarizer
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: text-summarizer
        image: text-summarizer:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: APP_ENV
          valueFrom:
            configMapKeyRef:
              name: text-summarizer-config
              key: APP_ENV
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: text-summarizer-config
              key: LOG_LEVEL
        - name: MONGODB_URL
          valueFrom:
            configMapKeyRef:
              name: text-summarizer-config
              key: MONGODB_URL
        - name: MONGODB_DATABASE
          valueFrom:
            configMapKeyRef:
              name: text-summarizer-config
              key: MONGODB_DATABASE
        - name: MAX_INPUT_LENGTH
          valueFrom:
            configMapKeyRef:
              name: text-summarizer-config
              key: MAX_INPUT_LENGTH
        - name: METRICS_PREFIX
          valueFrom:
            configMapKeyRef:
              name: text-summarizer-config
              key: METRICS_PREFIX
        - name: ALLOWED_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: text-summarizer-config
              key: ALLOWED_ORIGINS
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: text-summarizer-secrets
              key: JWT_SECRET_KEY
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: text-summarizer-secrets
              key: API_KEY
        - name: MONGODB_USERNAME
          valueFrom:
            secretKeyRef:
              name: text-summarizer-secrets
              key: MONGODB_USERNAME
              optional: true
        - name: MONGODB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: text-summarizer-secrets
              key: MONGODB_PASSWORD
              optional: true
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        livenessProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 30
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: logs
          mountPath: /app/logs
        - name: artifacts
          mountPath: /app/artifacts
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: logs
        emptyDir: {}
      - name: artifacts
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
