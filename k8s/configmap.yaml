apiVersion: v1
kind: ConfigMap
metadata:
  name: text-summarizer-config
  namespace: text-summarizer
  labels:
    app: text-summarizer
data:
  # Application Configuration
  APP_ENV: "production"
  APP_NAME: "Text Summarization API"
  APP_VERSION: "1.0.0"

  # Logging Configuration
  LOG_LEVEL: "INFO"

  # Server Configuration
  HOST: "0.0.0.0"
  PORT: "8080"

  # MongoDB Configuration
  MONGODB_URL: "mongodb://mongodb.text-summarizer.svc.cluster.local:27017"
  MONGODB_DATABASE: "text_summarizer"
  MONGODB_COLLECTION: "predictions"

  # Model Configuration
  MODEL_PATH: "/app/artifacts/model_trainer/pegasus-samsum-model"
  MAX_INPUT_LENGTH: "1000"

  # JWT Configuration
  JWT_EXPIRATION_MINUTES: "60"

  # Rate Limiting
  RATE_LIMIT_REQUESTS: "100"
  RATE_LIMIT_WINDOW_SECONDS: "60"

  # Metrics
  METRICS_PREFIX: "text_summarizer"

  # CORS Configuration
  ALLOWED_ORIGINS: "https://text-summarizer.example.com,https://app.example.com"
