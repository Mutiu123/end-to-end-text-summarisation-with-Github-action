apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: text-summarizer
  namespace: text-summarizer
  labels:
    app: text-summarizer
spec:
  podSelector:
    matchLabels:
      app: text-summarizer
      component: api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    - namespaceSelector:
        matchLabels:
          name: text-summarizer
    ports:
    - protocol: TCP
      port: 8080
  egress:
  # Allow DNS resolution
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow MongoDB connections
  - to:
    - podSelector:
        matchLabels:
          app: mongodb
    ports:
    - protocol: TCP
      port: 27017
  # Allow external MongoDB if using external service
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 27017
  # Allow HTTPS for external dependencies (model downloads, etc.)
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
