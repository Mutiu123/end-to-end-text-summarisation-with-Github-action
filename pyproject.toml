# =============================================================================
# Python Project Configuration
# =============================================================================

[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.pytest_cache
  | __pycache__
  | artifacts
  | research
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["textSummarizer"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["research/", "artifacts/"]

[tool.pylint.messages_control]
disable = [
    "C0114",  # missing-module-docstring
    "C0115",  # missing-class-docstring
    "C0116",  # missing-function-docstring
    "R0903",  # too-few-public-methods
    "W0511",  # fixme
]

[tool.pylint.format]
max-line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--cov=src/textSummarizer",
    "--cov-report=term-missing",
    "--cov-report=html:reports/coverage",
    "--cov-fail-under=80",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]

[tool.coverage.run]
source = ["src/textSummarizer"]
omit = [
    "*/tests/*",
    "*/research/*",
    "*/__pycache__/*",
    "*/conponents/*",
    "*/pipeline/stage_*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.flake8]
max-line-length = 100
exclude = [".git", "__pycache__", "artifacts", "research", ".mypy_cache"]
ignore = ["E203", "W503"]
